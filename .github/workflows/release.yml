name: Release

# On a version tag (v1.2.3, matching app/package.json): test, build, pack app/dist as team-monitor-<version>.tgz with
# its .sha256 and the two lines a project pins in scripts/cloud/team-monitor-hook.sh, and attach them to a GitHub
# release. The cloud hook downloads https://github.com/<repo>/releases/download/v<version>/team-monitor-<version>.tgz.
#
# Two jobs: `build` installs, tests, builds and packs with a read-only token; only `release` may write, and it runs
# no repository code: it downloads the packed files and calls `gh release create`.
# Every action is pinned to a full commit SHA (the release tag it was taken from is in the comment).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM: pnpm@10.28.0 # exact pnpm version (lockfile format 9.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Version from the tag (must match app/package.json)
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::tag $GITHUB_REF_NAME is not v<version>"; exit 1 ;;
          esac
          pkg=$(node -p "require('./app/package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/package.json version $pkg"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npx -y "$PNPM" install --frozen-lockfile

      - name: Test
        run: npx -y "$PNPM" run test

      - name: Build
        run: npx -y "$PNPM" run build:app

      - name: Pack
        run: sh scripts/cloud/pack-release.sh dist/release

      - name: Release notes with the pin lines
        run: |
          {
            echo "Pin this release in your copy of \`scripts/cloud/team-monitor-hook.sh\`:"
            echo
            echo '```sh'
            cat "dist/release/team-monitor-$VERSION.pin.txt"
            echo '```'
            echo
            echo "Setup of the hub, the cloud environment and the project: docs/cloud.md."
          } > dist/release/notes.md
          cat dist/release/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/team-monitor-${{ env.VERSION }}.tgz
            dist/release/team-monitor-${{ env.VERSION }}.tgz.sha256
            dist/release/team-monitor-${{ env.VERSION }}.pin.txt
            dist/release/notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets; nothing else runs in this job
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::tag $GITHUB_REF_NAME is not v<version>"; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "release/team-monitor-$version.tgz" \
            "release/team-monitor-$version.tgz.sha256" \
            "release/team-monitor-$version.pin.txt" \
            --title "team-monitor $version" \
            --notes-file release/notes.md \
            --verify-tag
